<!-- ავტორის ბარათი გვერდის ბოლოს (სერვისის, თემისა და დაგეგმილ გვერდებზე, სტატიებში) → {{AUTHOR_PATH}}. არგუმენტი subject (ნაგულისხმევი „სტატია“; გვერდზე — subject="გვერდი"). -->
<aside class="author-box" aria-label="ავტორის შესახებ">
  <img class="author-box__photo" src="{{PHOTO_PORTRAIT}}" alt="" width="96" height="120" loading="lazy" decoding="async">
  <div class="author-box__body">
    <p class="author-box__name"><a href="{{AUTHOR_PATH}}">{{NAME}}</a></p>
    <p class="author-box__role">{{ROLE}} · სივრცის დამფუძნებელი · {{AUTHOR_CREDENTIAL}}</p>
    <p>ვმუშაობ ინდივიდუალურად — გეშტალტისა და სხეულზე ორიენტირებული მიდგომით, სოლოლაკში და ონლაინ. ამ საიტის ყველა ტექსტს კონკრეტული ავტორი ჰყავს.</p>
    <p class="author-box__updated">{{@subject|სტატია}} ბოლოს განახლდა <time datetime="{{PAGE_DATE_MODIFIED_ISO}}">{{PAGE_DATE_MODIFIED}}</time>.</p>
  </div>
</aside>
