<!-- ავტორის ბარათი გვერდის ბოლოს (სტატიები, მეთოდისა და მდგომარეობის გვერდები). არგუმენტი: subject (ნაგულისხმევად „სტატია“; გვერდზე — subject="გვერდი"). -->
<aside class="author-box" aria-label="ავტორის შესახებ">
  <img class="author-box__photo" src="{{PHOTO_PORTRAIT}}" alt="" width="96" height="96" loading="lazy" decoding="async">
  <div class="author-box__body">
    <p class="author-box__name"><a href="{{AUTHOR_PATH}}">{{NAME}}</a></p>
    <p class="author-box__role">{{ROLE}} · ფსიქოთერაპია · {{AUTHOR_CREDENTIAL}}</p>
    <p>ვმუშაობ სიტყვითაც და სხეულითაც — გეშტალტ თერაპიისა და სხეულზე ორიენტირებული ფსიქოთერაპიის მიდგომებით, სოლოლაკის კაბინეტში და ონლაინ.</p>
    <p class="author-box__updated">{{@subject|სტატია}} ბოლოს განახლდა <time datetime="{{PAGE_DATE_MODIFIED_ISO}}">{{PAGE_DATE_MODIFIED}}</time>.</p>
  </div>
</aside>
