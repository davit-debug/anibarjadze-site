<!-- ავტორის ბარათი შინაარსის ბოლოს (ყველა სტატია, მეთოდის და თემის გვერდი, გზამკვლევი). არგუმენტი: subject (ნაგულისხმევად „ტექსტი“). -->
<aside class="author-box" aria-label="ავტორის შესახებ">
  <img class="author-box__photo" src="{{PHOTO_PORTRAIT}}" alt="" width="96" height="120" loading="lazy" decoding="async">
  <div class="author-box__body">
    <p class="author-box__label">ტექსტის ავტორი</p>
    <p class="author-box__name"><a href="{{AUTHOR_PATH}}">{{NAME}}</a></p>
    <p class="author-box__role">{{ROLE}} · {{AUTHOR_CREDENTIAL}}</p>
    <p>ამ ბიბლიოთეკის ყველა ტექსტს თავად ვწერ. ვმუშაობ გეშტალტისა და სხეულზე ორიენტირებული მიდგომებით — სოლოლაკის კაბინეტში და ონლაინ.</p>
    <p class="author-box__updated">{{@subject|ტექსტი}} ბოლოს განახლდა <time datetime="{{PAGE_DATE_MODIFIED_ISO}}">{{PAGE_DATE_MODIFIED}}</time>.</p>
  </div>
</aside>
